# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    hand_controller:
      type: position_controllers/GripperActionController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints:
      - firstDOF_final_Revolute_100
      - Nema_34_v3_Revolute_94
      - STEPPER_MOTOR_Revolute_74
      - AX_12A_04_3_Revolute_75
      - AX_12A_04_1_Revolute_80
      - AX_12A_04_2_Revolute_86
    action_ns: follow_joint_trajectory
    
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
hand_controller:
  ros__parameters:
    joint: gcomp1_Revolute_63
    action_ns: gripper_cmd